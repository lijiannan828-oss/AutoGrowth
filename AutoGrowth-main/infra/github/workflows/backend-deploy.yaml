name: Backend Deploy to Cloud Run

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'infra/**'
      - '.github/workflows/backend-deploy.yaml'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging

env:
  PROJECT_ID: autogrowth-477909
  REGION: us-central1
  ARTIFACT_REGISTRY_REPO: autogrowth-docker
  SERVICE_NAME: autogrowth-backend
  CLOUD_SQL_CONN_NAME: fleet-blend-469520-n7:us-central1:yvideo-factory-db-prod

jobs:
  deploy:
    name: Build and Deploy Backend
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker ${REGION}-docker.pkg.dev

      - name: Create Artifact Registry repository (if not exists)
        run: |
          gcloud artifacts repositories describe ${ARTIFACT_REGISTRY_REPO} \
            --location=${REGION} \
            --repository-format=docker \
            || gcloud artifacts repositories create ${ARTIFACT_REGISTRY_REPO} \
              --repository-format=docker \
              --location=${REGION} \
              --description="Docker repository for AutoGrowth backend"

      - name: Build Docker image
        working-directory: ./backend
        run: |
          docker build -t ${REGION}-docker.pkg.dev/${PROJECT_ID}/${ARTIFACT_REGISTRY_REPO}/${SERVICE_NAME}:${GITHUB_SHA} \
                       -t ${REGION}-docker.pkg.dev/${PROJECT_ID}/${ARTIFACT_REGISTRY_REPO}/${SERVICE_NAME}:latest .

      - name: Push Docker image to Artifact Registry
        run: |
          docker push ${REGION}-docker.pkg.dev/${PROJECT_ID}/${ARTIFACT_REGISTRY_REPO}/${SERVICE_NAME}:${GITHUB_SHA}
          docker push ${REGION}-docker.pkg.dev/${PROJECT_ID}/${ARTIFACT_REGISTRY_REPO}/${SERVICE_NAME}:latest

      - name: Prepare service account key file
        run: |
          echo "${{ secrets.GCP_SA_KEY }}" > /tmp/service-account.json
          chmod 600 /tmp/service-account.json

      - name: Deploy to Cloud Run
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/service-account.json
        run: |
          # Upload service account key to Cloud Run as a secret mount
          # First, create or update the secret in Secret Manager
          gcloud secrets create gcp-sa-key --data-file=/tmp/service-account.json --project=${PROJECT_ID} 2>/dev/null || \
          gcloud secrets versions add gcp-sa-key --data-file=/tmp/service-account.json --project=${PROJECT_ID}
          
          # Deploy Cloud Run service
          gcloud run deploy ${SERVICE_NAME} \
            --image ${REGION}-docker.pkg.dev/${PROJECT_ID}/${ARTIFACT_REGISTRY_REPO}/${SERVICE_NAME}:${GITHUB_SHA} \
            --region ${REGION} \
            --platform managed \
            --allow-unauthenticated \
            --port 8000 \
            --memory 512Mi \
            --cpu 1 \
            --min-instances 0 \
            --max-instances 10 \
            --timeout 300 \
            --concurrency 80 \
            --set-env-vars "APP_ENV=production,LOG_LEVEL=INFO,DATABASE_NAME=auto_growth,DATABASE_USER=appdev,USE_IAM_AUTH=false,CLOUD_SQL_CONNECTION_NAME=${CLOUD_SQL_CONN_NAME},GOOGLE_SHEETS_ID=${{ secrets.GOOGLE_SHEETS_ID || '' }}" \
            --set-secrets "DATABASE_PASSWORD=postgres-password:latest,GOOGLE_APPLICATION_CREDENTIALS=gcp-sa-key:latest" \
            --add-cloudsql-instances ${CLOUD_SQL_CONN_NAME} \
            --project ${PROJECT_ID}

      - name: Get Cloud Run service URL
        id: service-url
        run: |
          SERVICE_URL=$(gcloud run services describe ${SERVICE_NAME} \
            --region ${REGION} \
            --format 'value(status.url)' \
            --project ${PROJECT_ID})
          echo "url=${SERVICE_URL}" >> $GITHUB_OUTPUT
          echo "✅ Service deployed at: ${SERVICE_URL}"

      - name: Health check
        run: |
          sleep 10
          SERVICE_URL=$(gcloud run services describe ${SERVICE_NAME} \
            --region ${REGION} \
            --format 'value(status.url)' \
            --project ${PROJECT_ID})
          curl -f ${SERVICE_URL}/health || exit 1
          echo "✅ Health check passed"

