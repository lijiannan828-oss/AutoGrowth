# ============================================
# Cloud Build 配置：主应用 (autogrowth-backend-staging)
# ============================================
# 用途：构建并部署主应用到 Cloud Run
# 构建上下文：backend/ 目录
# Dockerfile 位置：backend/Dockerfile
# ============================================

steps:
  # 步骤 1：构建 Docker 镜像
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/autogrowth-docker/backend:$SHORT_SHA'
      - '-t'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/autogrowth-docker/backend:latest'
      - '-f'
      - 'Dockerfile'
      - '.'
    id: 'build-backend'
    timeout: 1200s

  # 步骤 2：推送镜像到 Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/autogrowth-docker/backend:$SHORT_SHA'
    id: 'push-backend-sha'
    waitFor: ['build-backend']

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/autogrowth-docker/backend:latest'
    id: 'push-backend-latest'
    waitFor: ['build-backend']

  # 步骤 3：部署到 Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'autogrowth-backend-staging'
      - '--image'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/autogrowth-docker/backend:$SHORT_SHA'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--port'
      - '8080'
      - '--allow-unauthenticated'
    id: 'deploy-to-cloud-run'
    waitFor: ['push-backend-sha']

# 构建超时时间
timeout: 1800s

# 构建选项
options:
  machineType: 'E2_HIGHCPU_8'
  logging: CLOUD_LOGGING_ONLY

# 镜像输出
images:
  - 'us-central1-docker.pkg.dev/$PROJECT_ID/autogrowth-docker/backend:$SHORT_SHA'
  - 'us-central1-docker.pkg.dev/$PROJECT_ID/autogrowth-docker/backend:latest'
