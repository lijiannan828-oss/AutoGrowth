<!DOCTYPE html>
<html>
<head>
    <title>贴纸测试</title>
    <style>
        body {
            padding: 20px;
            background: #f0f0f0;
        }
        .test-container {
            background: white;
            padding: 20px;
            margin: 20px 0;
            border-radius: 8px;
        }
        .sticker-test {
            width: 100px;
            height: 100px;
            border: 2px solid #ccc;
            margin: 10px;
            display: inline-block;
        }
        .sticker-test img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
    </style>
</head>
<body>
    <h1>贴纸加载测试</h1>
    
    <div class="test-container">
        <h2>测试 1: 直接路径</h2>
        <div class="sticker-test">
            <img src="/stickers/cute_animals/cat_wave.gif" alt="cat_wave" onerror="console.error('Failed to load:', this.src)">
        </div>
        <div class="sticker-test">
            <img src="/stickers/emoji/fire.png" alt="fire" onerror="console.error('Failed to load:', this.src)">
        </div>
        <div class="sticker-test">
            <img src="/stickers/badges/hot.png" alt="hot" onerror="console.error('Failed to load:', this.src)">
        </div>
    </div>

    <div class="test-container">
        <h2>测试 2: 完整 URL</h2>
        <div class="sticker-test">
            <img src="http://localhost:3001/stickers/cute_animals/cat_wave.gif" alt="cat_wave">
        </div>
    </div>

    <script>
        console.log('Testing sticker paths...');
        
        // 测试图片是否可以加载
        const testPaths = [
            '/stickers/cute_animals/cat_wave.gif',
            '/stickers/emoji/fire.png',
            '/stickers/badges/hot.png'
        ];
        
        testPaths.forEach(path => {
            fetch(path)
                .then(response => {
                    if (response.ok) {
                        console.log('✅ Success:', path);
                    } else {
                        console.error('❌ Failed:', path, response.status);
                    }
                })
                .catch(error => {
                    console.error('❌ Error:', path, error);
                });
        });
    </script>
</body>
</html>
