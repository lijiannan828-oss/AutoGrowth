name: Backend Deploy to Staging

on:
  push:
    branches:
      - staging
      - develop
    paths:
      - 'backend/**'
      - 'infra/**'
      - '.github/workflows/backend-deploy-staging.yaml'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging

env:
  PROJECT_ID: fleet-blend-469520-n7
  REGION: us-central1
  ARTIFACT_REGISTRY_REPO: autogrowth-docker
  SERVICE_NAME: autogrowth-backend-staging
  CLOUD_SQL_CONN_NAME: fleet-blend-469520-n7:us-central1:yvideo-factory-db-prod
  SERVICE_ACCOUNT: sa-run-prod@fleet-blend-469520-n7.iam.gserviceaccount.com
  # Staging 环境的 Job 名称
  TRANSFER_JOB_NAME: gdrive-transfer-worker-staging
  PROCESSOR_JOB_NAME: drama-processor-job-staging
  ZIP_JOB_NAME: zip-compress-worker-staging
  FISSION_JOB_NAME: fission-worker-staging

jobs:
  deploy:
    name: Build and Deploy Backend (Staging)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify GitHub Secrets
        run: |
          echo "🔍 Checking required GitHub Secrets for Staging..."
          if [ -z "${{ secrets.GCP_SA_KEY }}" ]; then
            echo "❌ ERROR: GCP_SA_KEY secret is not set"
            exit 1
          fi
          echo "✅ All required secrets verified"

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker ${REGION}-docker.pkg.dev

      - name: Build Docker image
        working-directory: ./backend
        run: |
          docker build -t ${REGION}-docker.pkg.dev/${PROJECT_ID}/${ARTIFACT_REGISTRY_REPO}/${SERVICE_NAME}:${GITHUB_SHA} \
                       -t ${REGION}-docker.pkg.dev/${PROJECT_ID}/${ARTIFACT_REGISTRY_REPO}/${SERVICE_NAME}:latest .

      - name: Push Docker image to Artifact Registry
        run: |
          docker push ${REGION}-docker.pkg.dev/${PROJECT_ID}/${ARTIFACT_REGISTRY_REPO}/${SERVICE_NAME}:${GITHUB_SHA}
          docker push ${REGION}-docker.pkg.dev/${PROJECT_ID}/${ARTIFACT_REGISTRY_REPO}/${SERVICE_NAME}:latest

      - name: Prepare service account key files
        run: |
          echo "${{ secrets.GCP_SA_KEY }}" > /tmp/service-account.json
          chmod 600 /tmp/service-account.json
          if [ -n "${{ secrets.GCP_SA_KEY_RUN_PROD }}" ]; then
            echo "${{ secrets.GCP_SA_KEY_RUN_PROD }}" > /tmp/service-account-run-prod.json
            chmod 600 /tmp/service-account-run-prod.json
          fi

      - name: Prepare staging environment variables file
        env:
          PIPELINE_GDRIVE_ROOTS: ${{ secrets.PIPELINE_GDRIVE_ROOTS }}
          PIPELINE_DEFAULT_TOKEN_REF: ${{ secrets.PIPELINE_DEFAULT_TOKEN_REF }}
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_OAUTH_REDIRECT_URI: ${{ secrets.GOOGLE_OAUTH_REDIRECT_URI }}
          GOOGLE_SHEETS_ID: ${{ secrets.GOOGLE_SHEETS_ID }}
          ALLOWED_EMAIL_DOMAINS: ${{ secrets.ALLOWED_EMAIL_DOMAINS }}
          OAUTH_TOKEN_ENCRYPTION_KEY: ${{ secrets.OAUTH_TOKEN_ENCRYPTION_KEY }}
        run: |
          cat <<ENV > /tmp/backend-env-staging.yaml
          APP_ENV: "staging"
          LOG_LEVEL: "DEBUG"
          DATABASE_NAME: "auto_growth"
          DATABASE_USER: "appdev"
          USE_IAM_AUTH: "false"
          FRONTEND_ORIGINS: "https://autogrowth-477909.web.app,https://autogrowth-frontend-staging-969581645484.us-central1.run.app,http://localhost:3000,http://localhost:3001"
          FIREBASE_PROJECT_ID: "fleet-blend-469520-n7"
          FIRESTORE_PROJECT_ID: "fleet-blend-469520-n7"
          FIRESTORE_NAMESPACE: "short-drama-resource-staging"
          PIPELINE_GCS_SOURCE_BUCKET: "vigloo_source"
          CLOUD_SQL_CONNECTION_NAME: "${CLOUD_SQL_CONN_NAME}"
          GOOGLE_SHEETS_ID: "${{ secrets.GOOGLE_SHEETS_ID }}"
          ALLOWED_EMAIL_DOMAINS: "${{ secrets.ALLOWED_EMAIL_DOMAINS }}"
          OAUTH_TOKEN_ENCRYPTION_KEY: "${{ secrets.OAUTH_TOKEN_ENCRYPTION_KEY }}"
          GOOGLE_OAUTH_CLIENT_ID: "${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}"
          GOOGLE_OAUTH_CLIENT_SECRET: "${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}"
          GOOGLE_OAUTH_REDIRECT_URI: "${{ secrets.GOOGLE_OAUTH_REDIRECT_URI }}"
          PIPELINE_GDRIVE_ROOTS: "${{ secrets.PIPELINE_GDRIVE_ROOTS }}"
          PIPELINE_DEFAULT_TOKEN_REF: "${{ secrets.PIPELINE_DEFAULT_TOKEN_REF }}"
          TRANSFER_JOB_NAME: "projects/${PROJECT_ID}/locations/${REGION}/jobs/${TRANSFER_JOB_NAME}"
          PROCESSOR_JOB_NAME: "projects/${PROJECT_ID}/locations/${REGION}/jobs/${PROCESSOR_JOB_NAME}"
          ZIP_JOB_NAME: "projects/${PROJECT_ID}/locations/${REGION}/jobs/${ZIP_JOB_NAME}"
          FISSION_JOB_NAME: "projects/${PROJECT_ID}/locations/${REGION}/jobs/${FISSION_JOB_NAME}"
          ENV

      - name: Deploy Transfer Worker Job (Staging)
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/service-account.json
        run: |
          gcloud run jobs deploy ${TRANSFER_JOB_NAME} \
            --image ${REGION}-docker.pkg.dev/${PROJECT_ID}/${ARTIFACT_REGISTRY_REPO}/${SERVICE_NAME}:${GITHUB_SHA} \
            --region ${REGION} \
            --service-account ${SERVICE_ACCOUNT} \
            --memory 2048Mi \
            --cpu 2 \
            --max-retries 3 \
            --parallelism 5 \
            --task-timeout 10800 \
            --tasks 1 \
            --command python \
            --args=-m \
            --args=app.workers.transfer.main \
            --env-vars-file /tmp/backend-env-staging.yaml \
            --project ${PROJECT_ID}

      - name: Deploy Processor Worker Job (Staging)
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/service-account.json
        run: |
          gcloud run jobs deploy ${PROCESSOR_JOB_NAME} \
            --image ${REGION}-docker.pkg.dev/${PROJECT_ID}/${ARTIFACT_REGISTRY_REPO}/${SERVICE_NAME}:${GITHUB_SHA} \
            --region ${REGION} \
            --service-account ${SERVICE_ACCOUNT} \
            --memory 4Gi \
            --cpu 2 \
            --max-retries 3 \
            --parallelism 50 \
            --task-timeout 10800 \
            --tasks 1 \
            --command python \
            --args=-m \
            --args=app.workers.process.main \
            --env-vars-file /tmp/backend-env-staging.yaml \
            --project ${PROJECT_ID}

      - name: Deploy ZIP Worker Job (Staging)
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/service-account.json
        run: |
          gcloud run jobs deploy ${ZIP_JOB_NAME} \
            --image ${REGION}-docker.pkg.dev/${PROJECT_ID}/${ARTIFACT_REGISTRY_REPO}/${SERVICE_NAME}:${GITHUB_SHA} \
            --region ${REGION} \
            --service-account ${SERVICE_ACCOUNT} \
            --memory 2048Mi \
            --cpu 2 \
            --max-retries 3 \
            --parallelism 5 \
            --task-timeout 3600 \
            --tasks 1 \
            --command python \
            --args=-m \
            --args=app.workers.zip_compress.main \
            --env-vars-file /tmp/backend-env-staging.yaml \
            --project ${PROJECT_ID}

      - name: Deploy Fission Worker Job (Staging)
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/service-account.json
        run: |
          gcloud run jobs deploy ${FISSION_JOB_NAME} \
            --image ${REGION}-docker.pkg.dev/${PROJECT_ID}/${ARTIFACT_REGISTRY_REPO}/${SERVICE_NAME}:${GITHUB_SHA} \
            --region ${REGION} \
            --service-account ${SERVICE_ACCOUNT} \
            --memory 8Gi \
            --cpu 8 \
            --max-retries 3 \
            --parallelism 10 \
            --task-timeout 600 \
            --tasks 1 \
            --command python \
            --args=-m \
            --args=app.workers.fission.main \
            --env-vars-file /tmp/backend-env-staging.yaml \
            --project ${PROJECT_ID}

      - name: Deploy Backend Service (Staging)
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/service-account.json
        run: |
          cat <<ENV > /tmp/backend-env-staging-service.yaml
          APP_ENV: "staging"
          LOG_LEVEL: "DEBUG"
          DATABASE_NAME: "auto_growth"
          DATABASE_USER: "appdev"
          USE_IAM_AUTH: "false"
          FRONTEND_ORIGINS: "https://autogrowth-477909.web.app,https://autogrowth-frontend-staging-969581645484.us-central1.run.app,http://localhost:3000,http://localhost:3001"
          FIREBASE_PROJECT_ID: "fleet-blend-469520-n7"
          FIRESTORE_PROJECT_ID: "fleet-blend-469520-n7"
          FIRESTORE_NAMESPACE: "short-drama-resource-staging"
          GCP_PROJECT_ID: "fleet-blend-469520-n7"
          FISSION_BUCKET: "vigloo_source"
          FISSION_UPLOAD_BUCKET: "vigloo-fission-uploads"
          PIPELINE_GCS_SOURCE_BUCKET: "vigloo_source"
          CLOUD_SQL_CONNECTION_NAME: "${CLOUD_SQL_CONN_NAME}"
          GOOGLE_APPLICATION_CREDENTIALS: "/secrets/sa-run-prod-key"
          GOOGLE_SHEETS_ID: "${{ secrets.GOOGLE_SHEETS_ID }}"
          OAUTH_TOKEN_ENCRYPTION_KEY: "${{ secrets.OAUTH_TOKEN_ENCRYPTION_KEY }}"
          ALLOWED_EMAIL_DOMAINS: "${{ secrets.ALLOWED_EMAIL_DOMAINS }}"
          GOOGLE_OAUTH_CLIENT_ID: "${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}"
          GOOGLE_OAUTH_CLIENT_SECRET: "${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}"
          GOOGLE_OAUTH_REDIRECT_URI: "${{ secrets.GOOGLE_OAUTH_REDIRECT_URI }}"
          PIPELINE_GDRIVE_ROOTS: "${{ secrets.PIPELINE_GDRIVE_ROOTS }}"
          PIPELINE_DEFAULT_TOKEN_REF: "${{ secrets.PIPELINE_DEFAULT_TOKEN_REF }}"
          TRANSFER_JOB_NAME: "projects/${PROJECT_ID}/locations/${REGION}/jobs/${TRANSFER_JOB_NAME}"
          PROCESSOR_JOB_NAME: "projects/${PROJECT_ID}/locations/${REGION}/jobs/${PROCESSOR_JOB_NAME}"
          ZIP_JOB_NAME: "projects/${PROJECT_ID}/locations/${REGION}/jobs/${ZIP_JOB_NAME}"
          FISSION_JOB_NAME: "projects/${PROJECT_ID}/locations/${REGION}/jobs/${FISSION_JOB_NAME}"
          ENV

          gcloud run deploy ${SERVICE_NAME} \
            --image ${REGION}-docker.pkg.dev/${PROJECT_ID}/${ARTIFACT_REGISTRY_REPO}/${SERVICE_NAME}:${GITHUB_SHA} \
            --region ${REGION} \
            --platform managed \
            --allow-unauthenticated \
            --service-account ${SERVICE_ACCOUNT} \
            --port 8080 \
            --memory 512Mi \
            --cpu 1 \
            --min-instances 0 \
            --max-instances 5 \
            --timeout 3600 \
            --concurrency 80 \
            --env-vars-file /tmp/backend-env-staging-service.yaml \
            --set-secrets "DATABASE_PASSWORD=postgres-password:latest,/secrets/sa-run-prod-key=sa-run-prod-key:latest" \
            --no-cpu-throttling \
            --add-cloudsql-instances ${CLOUD_SQL_CONN_NAME} \
            --project ${PROJECT_ID}

      - name: Get Staging Service URL
        run: |
          SERVICE_URL=$(gcloud run services describe ${SERVICE_NAME} \
            --region ${REGION} \
            --format 'value(status.url)' \
            --project ${PROJECT_ID})
          echo "✅ Staging service deployed at: ${SERVICE_URL}"

      - name: Health check
        run: |
          sleep 10
          SERVICE_URL=$(gcloud run services describe ${SERVICE_NAME} \
            --region ${REGION} \
            --format 'value(status.url)' \
            --project ${PROJECT_ID})
          curl -f ${SERVICE_URL}/health || echo "⚠️ Health check failed, but continuing..."
          echo "✅ Staging deployment completed"
