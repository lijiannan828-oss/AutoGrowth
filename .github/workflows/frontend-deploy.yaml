name: Frontend Deploy to Firebase Hosting

on:
  push:
    branches:
      - main
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-deploy.yaml'
  workflow_dispatch: {}

env:
  FIREBASE_PROJECT_ID: autogrowth-477909

jobs:
  deploy:
    name: Build and Deploy Frontend
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        id: gcp-auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
          token_format: 'access_token'

      - name: Verify required secrets
        run: |
          if [ -z "${{ secrets.GCP_SA_KEY }}" ]; then
            echo "❌ GCP_SA_KEY is missing"
            exit 1
          fi
          if [ -z "${{ secrets.BACKEND_API_URL }}" ]; then
            echo "❌ BACKEND_API_URL is missing"
            exit 1
          fi
          echo "✅ Secrets present"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Inject production env
        run: |
          cat <<'EOF' > .env.production
          NEXT_PUBLIC_FIREBASE_API_KEY=AIzaSyCx8tXxeiI9pZCxrr_fEwCyW8d73HFlD78
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=fleet-blend-469520-n7.firebaseapp.com
          NEXT_PUBLIC_FIREBASE_PROJECT_ID=fleet-blend-469520-n7
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET=fleet-blend-469520-n7.firebasestorage.app
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID=969581645484
          NEXT_PUBLIC_FIREBASE_APP_ID=1:969581645484:web:64f6a7f2baf6ad41265909
          NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID=G-VKT8LLFPYL
          NEXT_PUBLIC_API_URL=${{ secrets.BACKEND_API_URL }}
          EOF
          echo "✅ Wrote .env.production"

      - name: Build static site
        run: npm run build

      - name: Generate production firebase.json
        run: |
          cat <<'FBEOF' > firebase.json
          {
            "hosting": {
              "site": "autogrowth-477909",
              "source": ".",
              "ignore": ["firebase-debug.log", "firebase-debug.*.log"]
            }
          }
          FBEOF
          echo "✅ Generated production firebase.json with site: autogrowth-477909"

      - name: Deploy to Firebase Hosting
        env:
          FIREBASE_CLI_EXPERIMENTS: webframeworks
          GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.gcp-auth.outputs.credentials_file_path }}
        run: |
          npx --yes firebase-tools@latest deploy \
            --only hosting \
            --project "${FIREBASE_PROJECT_ID}" \
            --force \
            --non-interactive
